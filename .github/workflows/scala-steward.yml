name: Scala Steward

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write  # dispatch CI on the update branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scala-steward runs bare `mill`, but the action's fresh-install path never
      # adds its mill binary to PATH (only the tool-cache-hit path does, and hosted
      # runners start with an empty tool cache). Put the repo's own wrapper on PATH;
      # it resolves the version from .mill-version in whatever directory it runs in.
      # Use a dedicated dir: the action drops its own non-executable mill into
      # $HOME/bin (its chmod +x targets the coursier cache path, not the copy).
      - name: Put Mill wrapper on PATH
        run: |
          install -D mill "$HOME/mill-wrapper/mill"
          echo "$HOME/mill-wrapper" >> "$GITHUB_PATH"

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          author-email: 41898282+github-actions[bot]@users.noreply.github.com
          author-name: github-actions[bot]

      # GITHUB_TOKEN pushes never fire event-based workflows, so steward's PR
      # would sit with no checks. Dispatching via the API is allowed, and the
      # resulting check runs attach to the branch head SHA shown on the PR.
      - name: Trigger CI on the update branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code origin refs/heads/update/all >/dev/null 2>&1; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref update/all
          fi
