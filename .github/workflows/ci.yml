name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Scala Steward's PRs never trigger event-based CI (GITHUB_TOKEN pushes
  # don't fire workflows), so its workflow dispatches CI explicitly.
  workflow_dispatch:

# pull-requests: write lets the quality-report script maintain its sticky PR
# comment. Fork PRs get a read-only token; the script then only warns.
# The build and mutation jobs post their sections into that one comment
# concurrently: `post` merges onto the freshly fetched body, re-reads the
# comment and retries when a concurrent write dropped its section, so
# neither job waits for the other.
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: ${{ runner.os }}-coursier-${{ hashFiles('build.mill', 'mill-build/build.mill', '**/build.mill') }}
          restore-keys: ${{ runner.os }}-coursier-

      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('.mill-version') }}
          restore-keys: ${{ runner.os }}-mill-

      - name: Script selftest
        run: python3 .github/scripts/quality-report.py selftest

      - name: Compile
        run: ./mill __.compile

      # MillPluginTests are ScoverageTests, so this run is instrumented.
      - name: Test
        run: ./mill __.test

      - name: Coverage report
        run: ./mill scoverage.xmlReportAll + scoverage.htmlReportAll

      # Workspace-wide copy-paste detection (the dogfooded mill-cpd); fails on duplications at the error tier.
      - name: CPD
        run: ./mill duplication

      # The thresholds and languages must match `object duplication` in build.mill, which uses CpdSupport's defaults
      # (cpdMinimumTokens / cpdErrorTokens / cpdLanguages are plain defs, not tasks, so `./mill show` cannot read them).
      # Runs after a failed CPD step too: the section then lists the duplications, or says which report is missing.
      - name: Post CPD
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/quality-report.py cpd --report-dir out/duplication/cpdCheckAll.dest \
            --languages scala java --warn 25 --error 75 \
            | python3 .github/scripts/quality-report.py post --section cpd --pr ${{ github.event.pull_request.number }}

      # Example workspaces run a forked Mill against the locally published plugins (~5 min).
      - name: Examples
        run: ./mill __.example.testForked

      - name: Upload coverage report
        id: coverage_html
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: out/scoverage/htmlReportAll.dest
          if-no-files-found: ignore

      - name: Post coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.coverage_html.outputs.artifact-url }}
        run: |
          python3 .github/scripts/quality-report.py coverage --artifact-url "$ARTIFACT_URL" \
            | python3 .github/scripts/quality-report.py post --section coverage --pr ${{ github.event.pull_request.number }}

      - name: Format check
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll

      - name: Binary compatibility check
        run: ./mill __.mimaReportBinaryIssues

  # Mutation score of the PR's delta: every mutation-tested module whose src,
  # test or resources tree changed is run through stryker4s, restricted to its
  # changed production sources when it has any (mutated whole otherwise).
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Cache Coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: ${{ runner.os }}-coursier-${{ hashFiles('build.mill', 'mill-build/build.mill', '**/build.mill') }}
          restore-keys: ${{ runner.os }}-coursier-

      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('.mill-version') }}
          restore-keys: ${{ runner.os }}-mill-

      # A module is selected when the PR changes anything under its src, test or resources tree (example workspaces
      # and the build files do not count) and it has a strykerMutate task. Its scope is its changed .scala files under
      # <module>/src; a module without any (tests or resources only) gets an empty scope and is mutated whole.
      - name: Changed modules
        id: changed
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort -u)
          changed=$(awk -F/ '$2 == "src" || $2 == "test" || $2 == "resources" { print $1 }' <<<"$files" | sort -u)
          mutable=$(./mill resolve __.strykerMutate 2>/dev/null | sed -n 's/\.strykerMutate$//p' | sort -u)
          modules=$(comm -12 <(printf '%s\n' "$changed") <(printf '%s\n' "$mutable") | xargs)
          scopes=
          for m in $modules; do
            srcs=$(grep "^$m/src/.*\.scala$" <<<"$files" | paste -sd, || true)
            echo "Scope of $m: ${srcs:-whole module}"
            scopes="$scopes${scopes:+ }$m=$srcs"
          done
          echo "Changed modules: $(xargs <<<"$changed")"
          echo "Mutation-tested modules: $(xargs <<<"$mutable")"
          echo "Selected: ${modules:-<none>}"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "scopes=$scopes" >> "$GITHUB_OUTPUT"

      # strykerMutate is an exclusive command, so modules run one after another, each with its own scope as
      # STRYKER_INCLUDED_FILES (the strykerIncludedFiles override in build.mill reads it on every invocation): the
      # module's changed .scala files under <module>/src, or empty for a module whose changes are test- or
      # resource-only, which mutates it whole.
      - name: Mutation testing
        if: steps.changed.outputs.modules != ''
        continue-on-error: false
        env:
          SCOPES: ${{ steps.changed.outputs.scopes }}
        run: |
          for scope in $SCOPES; do
            STRYKER_INCLUDED_FILES="${scope#*=}" ./mill "${scope%%=*}.strykerMutate"
          done

      - name: Upload mutation reports
        id: mutation_html
        if: ${{ !cancelled() && steps.changed.outputs.modules != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-html
          path: out/*/strykerMutate.dest/target/stryker4s-report
          if-no-files-found: ignore

      - name: Post mutation
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODULES: ${{ steps.changed.outputs.modules }}
          SCOPES: ${{ steps.changed.outputs.scopes }}
          ARTIFACT_URL: ${{ steps.mutation_html.outputs.artifact-url }}
        run: |
          # shellcheck disable=SC2086 # MODULES and SCOPES are space-separated lists
          python3 .github/scripts/quality-report.py mutation $MODULES --scope $SCOPES --artifact-url "$ARTIFACT_URL" \
            | python3 .github/scripts/quality-report.py post --section mutation --pr ${{ github.event.pull_request.number }}
